name: E2E Integration Test

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          
      - name: Create .env file
        run: cp .env.example .env

      - name: Start Docker Compose Stack
        run: docker compose -f deploy/docker/docker-compose.yaml up -d --build
        
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to initialize..."
          sleep 20
          docker compose -f deploy/docker/docker-compose.yaml ps
          
      - name: Verify Web Frontend is up
        run: |
          curl --retry 5 --retry-connrefused --retry-delay 5 -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q '200'

      - name: Verify Scheduler gRPC is up
        run: |
          cd services/scheduler && go run tests/e2e_ping/main.go
          
      - name: Docker Compose Logs (on failure)
        if: failure()
        run: docker compose -f deploy/docker/docker-compose.yaml logs
