name: Publish Python Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-n-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cmake ninja-build autoconf autoconf-archive automake libtool

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'

      - name: Install pip dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine cmake ninja

      - name: Build binary wheel
        env:
          VCPKG_ROOT: '${{ github.workspace }}/vcpkg'
          SCCACHE_GHA_ENABLED: "true"
        run: |
          # Note: This will build the C++ extension if needed.
          # We pass VCPKG_ROOT so that setup.py finds the toolchain.
          python -m build

      - name: Publish to PyPI
        if: startsWith(github.ref, 'refs/tags')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/*
