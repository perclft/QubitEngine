name: CI

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Setup VCPKG Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-cache-


      - name: Install System Dependencies (MPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev ninja-build autoconf autoconf-archive automake libtool

      - name: Setup VCPKG
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
          fi
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Upload VCPKG Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-linux
          path: build/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Create Bin Directory
        run: mkdir -p bin

      - name: Configure CMake
        run: |
          cmake -S backend -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DMPI_ENABLED=ON \
            -DENABLE_CUDA=OFF \
            -DENABLE_SKIP_AUTH=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Generate Golden State Vectors
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --break-system-packages qiskit qiskit-aer
          python3 scripts/generate_golden_vectors.py

      - name: Run Tests
        env:
          QUBIT_ENGINE_SKIP_AUTH: "1"
        run: |
          ls -l bin
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/vcpkg_installed/x64-linux/lib:$LD_LIBRARY_PATH
          cd build
          ctest --output-on-failure --timeout 300

      - name: Generate Code Coverage
        run: |
          sudo apt-get install -y gcovr
          cd build
          gcovr -r ../backend/src . --xml -o coverage.xml
          
      - name: Upload Code Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-linux
          path: build/coverage.xml

      - name: Build Benchmark (No Coverage)
        run: |
          cmake -S backend -B build-bench -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPI_ENABLED=ON \
            -DENABLE_CUDA=OFF \
            -DENABLE_SKIP_AUTH=ON
          cmake --build build-bench --target benchmark --parallel $(nproc)

      - name: Run Benchmarks (3-run average)
        env:
          QUBIT_ENGINE_SKIP_AUTH: "1"
        run: |
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build-bench/vcpkg_installed/x64-linux/lib:$LD_LIBRARY_PATH
          for i in 1 2 3; do
            ./bin/benchmark > benchmark_run_$i.txt
          done
          # Use the last run as the primary output for artifact upload
          cp benchmark_run_3.txt benchmark_results.txt
          cat benchmark_results.txt

      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-linux
          path: benchmark_results.txt
          
      - name: Check Benchmark Regression
        run: |
          python3 -c "
          import re, sys
          bandwidths = []
          for i in range(1, 4):
              with open(f'benchmark_run_{i}.txt', 'r') as f:
                  results = f.read()
              match = re.search(r'Effective Bandwidth:\s+([\d.]+)', results)
              if match:
                  bandwidths.append(float(match.group(1)))
          if not bandwidths:
              print('Could not find any benchmark bandwidth values')
              sys.exit(1)
          avg_bw = sum(bandwidths) / len(bandwidths)
          with open('benchmarks/baseline.txt', 'r') as f:
              baseline = float(f.read().strip())
          print(f'Baseline: {baseline} GB/s, Average ({len(bandwidths)} runs): {avg_bw:.2f} GB/s')
          if avg_bw < baseline * 0.8:  # 20% tolerance with multi-run averaging
              print('Regression detected! Average is below 80% of baseline.')
              sys.exit(1)
          print('Benchmark passed.')
          "

      - name: Run Python Tests
        run: |
          pip3 install pytest numpy
          export PYTHONPATH=$GITHUB_WORKSPACE/python
          cp bin/core*.so python/qubit_engine/ || echo "Warning: core.so not found in bin/"
          pytest python/tests/

  build-mac:
    runs-on: macos-14 # M1 ARM64 runner
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Setup VCPKG Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-cache-


      - name: Install build tools
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config libomp || true

      - name: Setup VCPKG
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
          fi
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Upload VCPKG Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-mac
          path: build/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Create Bin Directory
        run: mkdir -p bin

      - name: Configure CMake
        run: |
          cmake -S backend -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPI_ENABLED=OFF \
            -DENABLE_CUDA=OFF \
            -DENABLE_SKIP_AUTH=ON

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run Tests
        env:
          QUBIT_ENGINE_SKIP_AUTH: "1"
        run: |
          ls -l bin
          export DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/vcpkg_installed/arm64-osx/lib:$DYLD_LIBRARY_PATH
          cd build
          ctest --output-on-failure --timeout 300

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Setup VCPKG Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-cache-


      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja

      - name: Setup VCPKG
        run: |
          if (!(Test-Path vcpkg)) {
            git clone https://github.com/microsoft/vcpkg.git
          }
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Upload VCPKG Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-windows
          path: build/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Create Bin Directory
        run: if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin -Force }

      - name: Configure CMake
        run: |
          cmake -S backend -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_CUDA=OFF `
            -DMPI_ENABLED=OFF `
            -DENABLE_SKIP_AUTH=ON

      - name: Build
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS

      - name: Test
        env:
          QUBIT_ENGINE_SKIP_AUTH: "1"
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\build\vcpkg_installed\x64-windows\bin;$env:PATH"
          cd build
          ctest --output-on-failure --timeout 300

  build-cuda:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04
      options: --dns 8.8.8.8
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - name: Install system dependencies needed for checkout
        run: |
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          echo 'Acquire::ForceIPv4 "true";' > /etc/apt/apt.conf.d/99force-ipv4
          for i in 1 2 3; do apt-get update && break || sleep 5; done
          apt-get install -y git curl zip unzip tar
        
      - uses: actions/checkout@v4

      - name: Setup VCPKG Binary Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-binary-cache-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-binary-cache-

      - name: Install build tools and MPI
        run: |
          for i in 1 2 3; do apt-get update && break || sleep 5; done
          apt-get install -y --allow-change-held-packages libopenmpi-dev ninja-build autoconf autoconf-archive automake libtool pkg-config python3-pip default-jre libnccl2 libnccl-dev
          pip3 install cmake

      - name: Setup VCPKG
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
          fi
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Configure CMake
        run: |
          cmake -S backend -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPI_ENABLED=OFF \
            -DENABLE_CUDA=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

  test-services:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24'

      - name: Force GOTOOLCHAIN Auto
        run: echo "GOTOOLCHAIN=auto" >> $GITHUB_ENV

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          export PATH=$PATH:$(go env GOPATH)/bin

      - name: Generate gRPC Code
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mkdir -p api/generated
          protoc --go_out=api/generated --go_opt=paths=source_relative --go-grpc_out=api/generated --go-grpc_opt=paths=source_relative -I . api/proto/quantum.proto api/proto/scheduler.proto

      - name: Test Scheduler
        run: |
          cd services/scheduler
          go test -v ./tests/e2e/...

      - name: Test Registry
        run: |
          cd services/registry
          go test -v ./...

      - name: Test Cache
        run: |
          cd services/cache
          go test -v ./...

  build-rust-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            cli-rs/target/
          key: cargo-${{ runner.os }}-${{ hashFiles('cli-rs/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build TUI
        working-directory: cli-rs
        run: cargo build --release

      - name: Run Tests
        working-directory: cli-rs
        run: cargo test --release

      - name: Clippy Lint
        working-directory: cli-rs
        run: cargo clippy -- -D warnings

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        working-directory: web
        run: npm install

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Test
        working-directory: web
        run: npm test -- --coverage

      - name: Upload Coverage Results
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-results
          path: web/coverage/

      - name: Build
        working-directory: web
        run: npm run build

  e2e-test:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4
 
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Force GOTOOLCHAIN Auto
        run: echo "GOTOOLCHAIN=auto" >> $GITHUB_ENV
          
      - name: Create .env file
        run: |
          cp .env.example .env
          echo "QUBIT_ENGINE_JWT_SECRET=e2e_ping_test_secret_1234567890" >> .env

      - name: Start Docker Compose Stack
        run: docker compose -f deploy/docker/docker-compose.yaml up -d --build
        
      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to become healthy..."
          MAX_RETRIES=30
          RETRY_INTERVAL=2
          for i in $(seq 1 $MAX_RETRIES); do
            WEB_OK=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000 2>/dev/null || echo "000")
            GRPC_OK=$(nc -z localhost 50051 2>/dev/null && echo "ok" || echo "fail")
            if [ "$WEB_OK" = "200" ] && [ "$GRPC_OK" = "ok" ]; then
              echo "All services healthy after $((i * RETRY_INTERVAL))s"
              docker compose -f deploy/docker/docker-compose.yaml ps
              exit 0
            fi
            echo "Attempt $i/$MAX_RETRIES: web=$WEB_OK grpc=$GRPC_OK — retrying in ${RETRY_INTERVAL}s..."
            sleep $RETRY_INTERVAL
          done
          echo "ERROR: Services failed to become healthy within $((MAX_RETRIES * RETRY_INTERVAL))s"
          docker compose -f deploy/docker/docker-compose.yaml ps
          docker compose -f deploy/docker/docker-compose.yaml logs
          exit 1
          
      - name: Verify Web Frontend is up
        run: |
          curl --retry 5 --retry-connrefused --retry-delay 5 -s -o /dev/null -w "%{http_code}" http://localhost:3000 | grep -q '200'

      - name: Verify Scheduler gRPC is up
        run: |
          cd services/scheduler && go run tests/e2e_ping/main.go
          
      - name: Run Web Playwright Tests
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
          
      - name: Docker Compose Logs (on failure)
        if: failure()
        run: docker compose -f deploy/docker/docker-compose.yaml logs

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Images
        run: |
          docker build -t qubitengine/scheduler:scan -f services/scheduler/Dockerfile .
          docker build -t qubitengine/engine:scan -f deploy/docker/Dockerfile.engine .
          docker build -t qubitengine/web:scan -f deploy/docker/Dockerfile.web .

      - name: Scan Scheduler Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'qubitengine/scheduler:scan'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Scan Engine Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'qubitengine/engine:scan'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true

      - name: Scan Web Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'qubitengine/web:scan'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
