name: CI

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v3

      - name: Export GitHub Actions Cache Variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install System Dependencies (MPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev ninja-build

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Upload VCPKG Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: vcpkg-logs
          path: build/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Create Bin Directory
        run: mkdir -p bin

      - name: Configure CMake
        run: |
          cmake -S backend -B build \
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPI_ENABLED=ON \
            -DENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build -- -j2

      - name: Run Tests
        run: |
          export LD_LIBRARY_PATH=$PWD/build/vcpkg_installed/x64-linux/lib:$LD_LIBRARY_PATH
          cd build
          ctest --output-on-failure

  build-mac:
    runs-on: macos-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v3

      - name: Export GitHub Actions Cache Variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install build tools
        run: brew install ninja cmake

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Create Bin Directory
        run: mkdir -p bin

      - name: Configure CMake
        run: |
          cmake -S backend -B build \
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPI_ENABLED=OFF

      - name: Build
        run: cmake --build build

      - name: Run Tests
        run: |
          cd build
          ctest --output-on-failure

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v3

      - name: Export GitHub Actions Cache Variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install MS-MPI
        run: |
          choco install msmpi

      - name: Setup VCPKG
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Create Bin Directory
        run: mkdir bin

      - name: Configure CMake
        run: |
          cmake -S backend -B build `
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_CUDA=OFF `
            -DMPI_ENABLED=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: |
          $env:PATH += ";$pwd\build\vcpkg_installed\x64-windows\bin"
          cd build
          ctest -C Release --output-on-failure
