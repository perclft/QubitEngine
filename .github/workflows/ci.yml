name: CI

on:
  push:
    branches: ["main", "feature/*"]
  pull_request:
    branches: ["main"]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache VCPKG
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - name: Install System Dependencies (MPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev ninja-build autoconf autoconf-archive automake libtool

      - name: Setup VCPKG
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
          fi
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Upload VCPKG Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-linux
          path: build/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Create Bin Directory
        run: mkdir -p bin

      - name: Configure CMake
        run: |
          cmake -S backend -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPI_ENABLED=ON \
            -DENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run Tests
        run: |
          ls -l bin
          export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/vcpkg_installed/x64-linux/lib:$LD_LIBRARY_PATH
          cd build
          ctest --output-on-failure --timeout 300

  build-mac:
    runs-on: macos-14 # M1 ARM64 runner
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache VCPKG
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-arm64-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-arm64-

      - name: Install build tools
        run: brew install ninja autoconf autoconf-archive automake libtool pkg-config || true

      - name: Setup VCPKG
        run: |
          if [ ! -d "vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git
          fi
          ./vcpkg/bootstrap-vcpkg.sh

      - name: Upload VCPKG Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-mac
          path: build/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Create Bin Directory
        run: mkdir -p bin

      - name: Configure CMake
        run: |
          cmake -S backend -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DCMAKE_BUILD_TYPE=Release \
            -DMPI_ENABLED=OFF \
            -DENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run Tests
        run: |
          ls -l bin
          export DYLD_LIBRARY_PATH=$GITHUB_WORKSPACE/build/vcpkg_installed/arm64-osx/lib:$DYLD_LIBRARY_PATH
          cd build
          ctest --output-on-failure --timeout 300

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions Cache Variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Cache VCPKG
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('backend/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja

      - name: Setup VCPKG
        run: |
          if (!(Test-Path vcpkg)) {
            git clone https://github.com/microsoft/vcpkg.git
          }
          .\vcpkg\bootstrap-vcpkg.bat

      - name: Upload VCPKG Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-windows
          path: build/vcpkg_installed/vcpkg/blds/**/*.log

      - name: Create Bin Directory
        run: if (!(Test-Path bin)) { New-Item -ItemType Directory -Path bin -Force }

      - name: Configure CMake
        run: |
          cmake -S backend -B build -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DENABLE_CUDA=OFF `
            -DMPI_ENABLED=OFF

      - name: Build
        run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS

      - name: Test
        run: |
          $env:PATH = "$env:GITHUB_WORKSPACE\build\vcpkg_installed\x64-windows\bin;$env:PATH"
          cd build
          ctest --output-on-failure --timeout 300

  test-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Go Protobuf Plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          export PATH=$PATH:$(go env GOPATH)/bin

      - name: Generate gRPC Code
        run: |
          export PATH=$PATH:$(go env GOPATH)/bin
          mkdir -p api/generated
          protoc --go_out=api/generated --go_opt=paths=source_relative --go-grpc_out=api/generated --go-grpc_opt=paths=source_relative -I . api/proto/quantum.proto api/proto/scheduler.proto

      - name: Test Scheduler
        run: |
          cd services/scheduler
          go test -v ./tests/e2e/...
