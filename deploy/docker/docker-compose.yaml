version: "3.8"

services:
  # 1. Quantum Engine (Backend)
  engine:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.engine
    image: qubit-engine:latest
    ports:
      - "50051:50051"
    networks:
      - qubit-net
    env_file:
      - ../../.env
    depends_on:
      - postgres

  # 2. PostgreSQL (Circuit Registry Backend)
  postgres:
    image: postgres:16-alpine
    env_file:
      - ../../.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qubit-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qubit -d quantumcloud"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Circuit Registry Service
  registry:
    build:
      context: ../..
      dockerfile: services/registry/Dockerfile
    ports:
      - "50052:50052"
    env_file:
      - ../../.env
    command: ["-db-host", "postgres"]
    networks:
      - qubit-net
    depends_on:
      postgres:
        condition: service_healthy

  # 4. Redis (Job Queue)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - qubit-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. Job Scheduler Service
  scheduler:
    build:
      context: ../..
      dockerfile: services/scheduler/Dockerfile
    ports:
      - "50053:50053"
    environment:
      - QUBIT_ENGINE_SKIP_AUTH=1
    env_file:
      - ../../.env
    command: ["-redis-addr", "redis:6379", "-engine-addr", "engine:50051"]
    networks:
      - qubit-net
    depends_on:
      redis:
        condition: service_healthy
      engine:
        condition: service_started

  # 6. Result Cache Service
  cache:
    build:
      context: ../..
      dockerfile: services/cache/Dockerfile
    ports:
      - "50054:50054"
    command: ["-redis-addr", "redis:6379", "-default-ttl", "60"]
    networks:
      - qubit-net
    depends_on:
      redis:
        condition: service_healthy

  # 7. Web Frontend (Next.js)
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - SCHEDULER_GRPC_ADDR=scheduler:50053
      - ENGINE_GRPC_ADDR=engine:50051
      - REGISTRY_GRPC_ADDR=registry:50052
    networks:
      - qubit-net
    depends_on:
      - scheduler
      - engine

  # 8. Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:1.54
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - qubit-net

networks:
  qubit-net:
    driver: bridge

volumes:
  postgres_data:
