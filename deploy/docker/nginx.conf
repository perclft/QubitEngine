server {
    listen 80;
    server_name localhost;

    # Serve the React application
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache busting for index.html to ensure users get the new code
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Reverse proxy gRPC-Web requests directly to Envoy without CORS
    location ~* ^/(qubit_engine\.|api\.) {
        # 'envoy' is the internal kubernetes DNS name for the proxy service
        proxy_pass http://envoy.qubit-engine.svc.cluster.local:8080;
        
        # Essential HTTP/1.1 headers for keep-alive/streaming
        proxy_http_version 1.1;
        proxy_set_header Connection keep-alive;
        
        # Forward original Host and IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable buffering to allow gRPC-Web streaming to flush immediately
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
