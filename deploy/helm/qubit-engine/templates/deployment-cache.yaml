apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qubit-engine.fullname" . }}-cache
  labels:
    {{- include "qubit-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  replicas: {{ .Values.cache.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "qubit-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        {{- include "qubit-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: cache
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.cache.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 50054
              name: grpc
          command: ["/app/cache"]
          args:
            - "-redis-addr"
            - "{{ include "qubit-engine.fullname" . }}-redis:6379"
            - "-default-ttl"
            - "60"
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qubit-engine.fullname" . }}-cache
  labels:
    {{- include "qubit-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache
spec:
  type: ClusterIP
  ports:
    - port: 50054
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "qubit-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache
