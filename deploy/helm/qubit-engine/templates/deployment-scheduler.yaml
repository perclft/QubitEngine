apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qubit-engine.fullname" . }}-scheduler
  labels:
    {{- include "qubit-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  replicas: {{ .Values.scheduler.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "qubit-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: scheduler
  template:
    metadata:
      labels:
        {{- include "qubit-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
    spec:
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.scheduler.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 50053
              name: grpc
          command: ["/app/scheduler"]
          args:
            - "-redis-addr"
            - "{{ include "qubit-engine.fullname" . }}-redis:6379"
            - "-engine-addr"
            - "{{ include "qubit-engine.fullname" . }}-backend-headless:50051"
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50053
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qubit-engine.fullname" . }}-scheduler
  labels:
    {{- include "qubit-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  ports:
    - port: 50053
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "qubit-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
