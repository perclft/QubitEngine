apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qubit-engine.fullname" . }}-registry
  labels:
    {{- include "qubit-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  replicas: {{ .Values.registry.replicaCount | default 1 }}
  selector:
    matchLabels:
      {{- include "qubit-engine.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: registry
  template:
    metadata:
      labels:
        {{- include "qubit-engine.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: registry
    spec:
      containers:
        - name: registry
          image: "{{ .Values.registry.image.repository }}:{{ .Values.registry.image.tag | default "latest" }}"
          imagePullPolicy: {{ .Values.registry.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 50052
              name: grpc
          command: ["/app/registry"]
          args:
            - "-db-host"
            - "{{ include "qubit-engine.fullname" . }}-postgres"
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "qubit-engine.fullname" . }}-postgres
                  key: postgres-password
          resources:
            {{- toYaml .Values.registry.resources | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qubit-engine.fullname" . }}-registry
  labels:
    {{- include "qubit-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: registry
spec:
  type: ClusterIP
  ports:
    - port: 50052
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "qubit-engine.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: registry
