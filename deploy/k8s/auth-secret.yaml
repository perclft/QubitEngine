apiVersion: v1
kind: Secret
metadata:
  name: qubit-engine-auth
type: Opaque
data:
  # echo -n "your-secret-token" | base64
  QUBIT_ENGINE_AUTH_TOKEN: dGhpcy1pcy1hLXJlYWwtc2VjcmV0LXRva2Vu
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qubit-scheduler
spec:
  template:
    spec:
      containers:
      - name: scheduler
        env:
        - name: QUBIT_ENGINE_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: qubit-engine-auth
              key: QUBIT_ENGINE_AUTH_TOKEN
