apiVersion: v1
kind: Secret
metadata:
  name: qubit-engine-auth
  namespace: qubit-system
type: Opaque
stringData:
  # In production, replace with secure randomly generated secrets.
  # QUBIT_ENGINE_JWT_SECRET is used by the C++ engine and auth packages for JWT HMAC validation.
  # QUBIT_ENGINE_AUTH_TOKEN is used by client services (scheduler/cli) for Bearer authentication.
  QUBIT_ENGINE_JWT_SECRET: "REPLACE_WITH_SECURE_JWT_SECRET_32_CHARS"
  QUBIT_ENGINE_AUTH_TOKEN: "REPLACE_WITH_SECURE_AUTH_TOKEN"
