apiVersion: batch/v1
kind: Job
metadata:
  name: qubit-distributed-integration-test
  namespace: qubit-system
spec:
  parallelism: 1
  completions: 1
  template:
    spec:
      containers:
        - name: test-runner
          image: qubit-engine:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          # We run with mpirun -np 2 to verify sharding logic
          # The image is assumed to have the python script and the core module installed
          args: 
            - |
              mpirun --allow-run-as-root --oversubscribe -np 2 \
              python3 /usr/local/share/qubit-engine/tests/test_mpi_sharding.py
          env:
            - name: PYTHONPATH
              value: "/usr/local/lib/python3.10/site-packages:/usr/local/bin"
            - name: OMPI_ALLOW_RUN_AS_ROOT
              value: "1"
            - name: OMPI_ALLOW_RUN_AS_ROOT_CONFIRM
              value: "1"
      restartPolicy: Never
  backoffLimit: 1
