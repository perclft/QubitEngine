---
# Gaming
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gaming
  namespace: qubit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gaming
  template:
    metadata:
      labels:
        app: gaming
    spec:
      containers:
      - name: gaming
        image: docker-gaming:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50061
---
apiVersion: v1
kind: Service
metadata:
  name: gaming
  namespace: qubit-engine
spec:
  ports:
  - port: 50061
  selector:
    app: gaming

