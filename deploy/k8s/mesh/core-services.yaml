---
# Qubit Engine (Backend)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engine
  namespace: qubit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engine
  template:
    metadata:
      labels:
        app: engine
    spec:
      containers:
      - name: engine
        image: qubit-engine:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 50051
---
apiVersion: v1
kind: Service
metadata:
  name: engine
  namespace: qubit-engine
spec:
  ports:
  - port: 50051
  selector:
    app: engine

---
# Registry
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: qubit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
      - name: registry
        image: docker-registry:latest
        imagePullPolicy: Never
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: qubit
        - name: DB_PASS
          value: quantum
        - name: DB_NAME
          value: quantumcloud
        command: ["./registry", "-db-host", "postgres"]
        ports:
        - containerPort: 50052
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: qubit-engine
spec:
  ports:
  - port: 50052
  selector:
    app: registry

---
# Scheduler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: qubit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
      - name: scheduler
        image: docker-scheduler:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        command: ["./scheduler", "-redis-addr", "redis:6379"]
        ports:
        - containerPort: 50053
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: qubit-engine
spec:
  ports:
  - port: 50053
  selector:
    app: scheduler

---
# Cache
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cache
  namespace: qubit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cache
  template:
    metadata:
      labels:
        app: cache
    spec:
      containers:
      - name: cache
        image: docker-cache:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        command: ["./cache", "-redis-addr", "redis:6379"]
        ports:
        - containerPort: 50054
---
apiVersion: v1
kind: Service
metadata:
  name: cache
  namespace: qubit-engine
spec:
  ports:
  - port: 50054
  selector:
    app: cache
