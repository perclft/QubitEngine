---
# Envoy
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: qubit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.25-latest
        ports:
        - containerPort: 8080
        - containerPort: 9901
        volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy/envoy.yaml
          subPath: envoy.yaml
      volumes:
      - name: envoy-config-volume
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: qubit-engine
spec:
  type: LoadBalancer
  ports:
  - port: 8080
    name: proxy
  - port: 9901
    name: admin
  selector:
    app: envoy

---
# Web
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: qubit-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: docker-web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: qubit-engine
spec:
  type: LoadBalancer # Exposes on localhost:5173 or cluster IP
  ports:
  - port: 5173
    targetPort: 80
  selector:
    app: web
