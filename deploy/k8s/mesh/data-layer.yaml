---
# Postgres
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: qubit-engine
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: qubit
        - name: POSTGRES_PASSWORD
          value: quantum
        - name: POSTGRES_DB
          value: quantumcloud
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: qubit-engine
spec:
  ports:
  - port: 5432
  selector:
    app: postgres

---
# Redis
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: qubit-engine
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: qubit-engine
spec:
  ports:
  - port: 6379
  selector:
    app: redis
